name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  SITE_URL: https://www.betpawa.com
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Creer le projet
        run: |
          mkdir -p app/src/main/java/com/siteapp/betpawa app/src/main/res/drawable app/src/main/res/values app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
              }
          }
          rootProject.name = 'BetpawaTablette'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.siteapp.betpawa'
              compileSdk 33

              defaultConfig {
                  applicationId "com.siteapp.betpawa"
                  minSdk 16
                  targetSdk 21
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'armeabi-v7a' }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'org.xwalk:xwalk_core_library:23.53.589.4'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:label="Betpawa"
                  android:icon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fond">#00552B</color>
              <style name="AppTheme" parent="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@color/fond</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/assets/offline.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
          body{margin:0;background:#00552B;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
          h2{margin:0 0 10px}p{margin:0 0 24px;opacity:.85}
          a{display:inline-block;background:#fff;color:#00552B;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:bold}
          </style></head>
          <body><div>
          <h2>Pas de connexion</h2>
          <p>Vérifie le Wi-Fi ou les données mobiles.</p>
          <a href="__URL__">Réessayer</a>
          </div></body></html>
          EOF
          cat > app/src/main/java/com/siteapp/betpawa/MainActivity.java <<'EOF'
          package com.siteapp.betpawa;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.os.Bundle;
          import android.view.WindowManager;
          import org.xwalk.core.XWalkActivity;
          import org.xwalk.core.XWalkNavigationHistory;
          import org.xwalk.core.XWalkResourceClient;
          import org.xwalk.core.XWalkView;

          public class MainActivity extends XWalkActivity {
              private static final String URL = "__URL__";
              private XWalkView view;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              private boolean enLigne() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkInfo ni = cm == null ? null : cm.getActiveNetworkInfo();
                  return ni != null && ni.isConnected();
              }

              @Override
              protected void onXWalkReady() {
                  view = new XWalkView(this, this);
                  view.setResourceClient(new XWalkResourceClient(view) {
                      @Override
                      public void onReceivedLoadError(XWalkView v, int errorCode, String description, String failingUrl) {
                          super.onReceivedLoadError(v, errorCode, description, failingUrl);
                          if (!enLigne()) {
                              v.load("file:///android_asset/offline.html", null);
                          }
                      }
                  });
                  setContentView(view);
                  if (enLigne()) {
                      view.load(URL, null);
                  } else {
                      view.load("file:///android_asset/offline.html", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (view != null && view.getNavigationHistory().canGoBack()) {
                      view.getNavigationHistory().navigate(XWalkNavigationHistory.Direction.BACKWARD, 1);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (view != null) view.pauseTimers();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (view != null) view.resumeTimers();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (view != null) view.onDestroy();
              }
          }
          EOF
